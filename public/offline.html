<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noted - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: hsl(var(--background, 0 0% 100%));
      color: hsl(var(--foreground, 0 0% 3.9%));
      padding: 1rem;
      text-align: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: hsl(var(--foreground, 0 0% 3.9%));
    }
    p {
      font-size: 1.125rem;
      margin-bottom: 2rem;
      color: hsl(var(--muted-foreground, 0 0% 45.1%));
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 2rem;
      opacity: 0.5;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: hsl(var(--background, 0 0% 3.9%));
        color: hsl(var(--foreground, 0 0% 98%));
      }
      h1 {
        color: hsl(var(--foreground, 0 0% 98%));
      }
      p {
        color: hsl(var(--muted-foreground, 0 0% 63.9%));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" />
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>It looks like you're not connected to the internet. Please check your connection and try again.</p>
    <button onclick="window.location.reload()" style="padding: 0.75rem 1.5rem; background: hsl(var(--primary, 0 0% 9%)); color: hsl(var(--primary-foreground, 0 0% 98%)); border: none; border-radius: 0.5rem; font-size: 1rem; cursor: pointer; font-weight: 500;">
      Retry
    </button>
  </div>
</body>
</html>
